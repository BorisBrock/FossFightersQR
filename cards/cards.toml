#:schema ./cards.schema.json
schema_version = 1

# Card 1: uses every field, including a multi-line effect
[[card]]
name    = "fireball"
qr      = "CORE-001"
deck    = "core"
level   = 3
title    = { en = "Fireball", de = "Feuerball" }
symbols = [
  { type = "attack", strength = 3 },
  { type = "support", strength = 1 },
]

[card.effect]
en = """
Deal 3 damage to a target.
If it is burning, deal 5 instead."""
de = """
Füge einem Ziel 3 Schaden zu.
Brennt es, füge stattdessen 5 zu."""

# Card 2: only the required fields
[[card]]
name = "mana-potion"
qr   = "CORE-002"
deck = "core"
title = { en = "Healing Herb", de = "Heilkraut" }
